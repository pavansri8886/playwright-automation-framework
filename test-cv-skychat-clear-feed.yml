# .azure-pipelines/test-cv-skychat-clear-feed.yml
# SkyChat Clear Feed suite. Trigger: EVERY DAY at 07:00 Luxembourg time on TEST (+ manual runs allowed).

name: SkyChat_ClearFeed_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

# Azure DevOps schedules are UTC only (no daylight saving).
#   Winter (CET,  UTC+1): 06:00 UTC = 07:00 Luxembourg   <- current setting (from 25 Oct 2026)
#   Summer (CEST, UTC+2): 05:00 UTC = 07:00 Luxembourg   -> change to '0 5 * * *' after 28 Mar 2027
schedules:
  - cron: '0 6 * * *'
    displayName: daily-0700
    branches:
      include: [ main ]
    always: true            # run every day even if the test code did not change

parameters:
  - name: environments
    displayName: 'Environment'
    type: string
    default: TEST           # scheduled runs always use this default
    values: [TEST, UAT, Both]

jobs:
  - template: templates/playwright-suite.yml
    parameters:
      project: skychat
      displayName: SkyChat
      suite: ClearFeed
      specFile: clear-feed.spec.ts
      environments: ${{ parameters.environments }}
      variableGroup: Skychat-Variables
